<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>シューティング</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header>
      <h1>シューティング</h1>
      <div class="status">
        <span>スコア: <strong id="score">0</strong></span>
        <span>ハイスコア: <strong id="high-score">0</strong></span>
        <span>ライフ: <strong id="lives">3</strong></span>
        <span>ウェーブ: <strong id="wave">1</strong></span>
      </div>
    </header>

    <canvas id="canvas" width="480" height="640"></canvas>

    <p class="help">
      ← → ↑ ↓ / WASD で移動、スペースで射撃、P で一時停止<br>
      スマホは画面をドラッグで移動（射撃は自動）
    </p>
  </main>

  <script src="game.js"></script>
</body>
</html>
